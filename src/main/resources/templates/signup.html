<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Corp - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#1d4ed8', 'primary-dark': '#1e40af' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-600 via-blue-700 to-blue-900 font-sans">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-full mb-4">
                    <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 48 48">
                        <path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-black text-gray-900 mb-2">Create Account</h1>
                <p class="text-gray-600">Join Bank Corp today</p>
            </div>

            <div th:if="${error}"
                class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm font-semibold">
                <p th:text="${error}"></p>
            </div>

            <form th:action="@{/signup}" th:object="${user}" method="post" class="space-y-4">

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                    <input type="text" th:field="*{fullName}" placeholder="(e.g) John Doe"
                        class="w-full px-4 py-3 border rounded-lg outline-none transition"
                        th:classappend="${#fields.hasErrors('fullName')} ? 'border-red-500 focus:ring-red-500' : 'border-gray-300 focus:ring-blue-500'">
                    <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"
                        class="text-red-600 text-xs mt-1 font-bold"></p>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                    <input type="text" th:field="*{username}" placeholder="Choose a username (Min. 4 characters)"
                        class="w-full px-4 py-3 border rounded-lg outline-none transition"
                        th:classappend="${#fields.hasErrors('username')} ? 'border-red-500 focus:ring-red-500' : 'border-gray-300 focus:ring-blue-500'">
                    <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}"
                        class="text-red-600 text-xs mt-1 font-bold"></p>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" th:field="*{password}" placeholder="Min. 6 characters"
                            class="w-full px-4 py-3 border rounded-lg outline-none transition"
                            th:classappend="${#fields.hasErrors('password')} ? 'border-red-500 focus:ring-red-500' : 'border-gray-300 focus:ring-blue-500'">
                        <button type="button"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <span class="material-symbols-outlined text-xl">visibility_off</span>
                        </button>
                    </div>
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
                        class="text-red-600 text-xs mt-1 font-bold"></p>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Confirm Password</label>
                    <div class="relative">
                        <input type="password" th:field="*{confirmPassword}" placeholder="Retype password"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                        <button type="button"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <span class="material-symbols-outlined text-xl">visibility_off</span>
                        </button>
                    </div>
                </div>

                <div class="flex items-start gap-2 pt-2">
                    <input type="checkbox" id="terms"
                        class="w-5 h-5 mt-0.5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <label for="terms" class="text-sm text-gray-600">
                        I agree to the <a href="#" class="text-blue-600 font-semibold hover:underline">Terms and
                            Conditions</a>
                    </label>
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors shadow-lg hover:shadow-xl mt-6">
                    Create Account
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    Already have an account? <a href="/login" class="text-blue-600 font-semibold hover:underline">Sign
                        in</a>
                </p>
            </div>

            <div class="mt-6 flex items-center justify-center gap-4 text-gray-400 text-xs">
                <div class="flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">lock</span>
                    <span>SSL Secure</span>
                </div>
                <div class="flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">shield</span>
                    <span>FDIC Insured</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
